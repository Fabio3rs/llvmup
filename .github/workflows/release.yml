name: Release LLVMUP
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build release packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 packaging/build.py "$RELEASE_TAG"
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/llvmup-linux.tar.gz dist/llvmup-windows.zip dist/bootstrap.sh dist/bootstrap.ps1 dist/SHA256SUMS
