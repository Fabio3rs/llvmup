name: Release LLVMUP
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package (for example vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check out the release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          path: release-source
      - name: Build release packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 release-source/packaging/build.py "$RELEASE_TAG" --output "$GITHUB_WORKSPACE/dist"
      # Build provenance for the packages (the SHA256SUMS file is still published and verified by
      # the bootstraps).
      - name: Attest build provenance of the release packages
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/llvmup-windows.zip
            dist/llvmup-linux.tar.gz
      - name: Publish verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash packaging/publish.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/dist"
