name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to test
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl zsh python3

    - name: Install BATS
      run: |
        # Create local bin directory
        mkdir -p ~/.local/bin
        # Pin BATS so upstream changes do not alter CI behavior unexpectedly
        git clone --branch v1.14.0 --depth 1 https://github.com/bats-core/bats-core.git
        cd bats-core
        # Create necessary directories with proper permissions
        mkdir -p ~/.local/lib/bats-core
        mkdir -p ~/.local/libexec
        mkdir -p ~/.local/share/man/man7
        # Install to local directory
        ./install.sh ~/.local
        cd ..
        rm -rf bats-core
        # Add to PATH
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        # Verify installation
        echo "Verifying BATS installation..."
        which bats || echo "BATS not found in PATH"
        echo "Current PATH: $PATH"
        # List installed files
        echo "Installed files:"
        ls -la ~/.local/bin/bats
        ls -la ~/.local/lib/bats-core/

    - name: Install the project
      run: |
        chmod +x install.sh
        ./install.sh

    - name: Test selective installation engine
      run: python3 tests/unit/test_selection.py

    - name: Run BATS tests
      run: |
        # Ensure PATH is updated in this step
        export PATH="$HOME/.local/bin:$PATH"
        echo "Running tests with PATH: $PATH"
        echo ""
        echo "Available test files:"
        ls -la tests/unit/*.bats
        echo ""

        # Run the test runner script
        chmod +x tests/run_tests.sh
        ./tests/run_tests.sh
      continue-on-error: false

    - name: Prepare lightweight LLVM fixture for action smoke test
      run: |
        fixture="$RUNNER_TEMP/llvmup-data/toolchains/llvmorg-20.1.8/bin"
        mkdir -p "$fixture"
        printf '#!/bin/sh\necho clang version 20.1.8\n' > "$fixture/clang"
        printf '#!/bin/sh\necho clang version 20.1.8\n' > "$fixture/clang++"
        printf '#!/bin/sh\nexit 0\n' > "$fixture/lld"
        chmod +x "$fixture/clang" "$fixture/clang++" "$fixture/lld"

    - name: Smoke test reusable action
      id: setup-llvm
      uses: ./
      env:
        LLVMUP_RELEASES_FILE: ${{ github.workspace }}/githubreleases.json
      with:
        version: 20.1.8
        # Never persist the lightweight fake compiler under a production cache key.
        cache: false
        verbose: true

    - name: Verify action outputs and environment
      env:
        RESOLVED_VERSION: ${{ steps.setup-llvm.outputs.version }}
        LLVM_PATH: ${{ steps.setup-llvm.outputs.llvm-path }}
      run: |
        test "$RESOLVED_VERSION" = "llvmorg-20.1.8"
        test -x "$LLVM_PATH/bin/clang"
        test "$CC" = "$LLVM_PATH/bin/clang"
        clang --version

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: bats-test-results
        path: |
          tests/unit/*.bats
          tests/run_tests.sh

  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module -Name Pester -RequiredVersion 6.1.0 -Force -SkipPublisherCheck
        Import-Module Pester -RequiredVersion 6.1.0

    - name: Run Pester tests
      shell: pwsh
      run: |
        $result = Invoke-Pester tests/unit/*.Tests.ps1 -Output Detailed -PassThru
        if ($result.FailedCount -gt 0) {
          Write-Error "Pester tests failed: $($result.FailedCount) test(s) failed"
          exit 1
        }
        Write-Host "All tests passed successfully!"

    - name: Smoke test the distributable Windows package
      shell: pwsh
      run: |
        python packaging/build.py v0.0.0-ci --output "$env:RUNNER_TEMP/packages"
        if ($LASTEXITCODE -ne 0) { throw 'Package build failed' }
        Expand-Archive -LiteralPath "$env:RUNNER_TEMP/packages/llvmup-windows.zip" -DestinationPath "$env:RUNNER_TEMP/package-test"
        & "$env:RUNNER_TEMP/package-test/llvmup/packaging/Install-Llvmup.ps1" -InstallDir "$env:RUNNER_TEMP/installed llvmup" -NoProfile
        Import-Module "$env:RUNNER_TEMP/installed llvmup/Llvm-Functions.psm1" -Force
        $result = llvmup doctor --json | ConvertFrom-Json
        if ($result.exit_code -ne 0) { throw ($result | ConvertTo-Json -Depth 6) }
        & "$env:RUNNER_TEMP/installed llvmup/Uninstall-Llvmup.ps1" -NoProfile

    - name: Prepare lightweight LLVM fixture for Windows action smoke test
      shell: pwsh
      run: |
        $bin = Join-Path $env:RUNNER_TEMP 'llvmup-data\toolchains\llvmorg-20.1.8\bin'
        New-Item -ItemType Directory -Path $bin -Force | Out-Null
        '@echo off', 'echo clang version 20.1.8' | Set-Content -Path (Join-Path $bin 'clang.cmd') -Encoding Ascii
        '@echo off', 'echo clang version 20.1.8' | Set-Content -Path (Join-Path $bin 'clang++.cmd') -Encoding Ascii
        '@echo off', 'exit /b 0' | Set-Content -Path (Join-Path $bin 'lld-link.cmd') -Encoding Ascii

    - name: Smoke test reusable action on Windows
      id: setup-llvm-windows
      uses: ./
      env:
        LLVMUP_RELEASES_FILE: ${{ github.workspace }}\githubreleases.json
      with:
        version: 20.1.8
        cache: false
        verbose: true

    - name: Verify Windows action outputs and environment
      shell: pwsh
      env:
        RESOLVED_VERSION: ${{ steps.setup-llvm-windows.outputs.version }}
        LLVM_PATH: ${{ steps.setup-llvm-windows.outputs.llvm-path }}
      run: |
        if ($env:RESOLVED_VERSION -ne 'llvmorg-20.1.8') { throw "Unexpected version: $env:RESOLVED_VERSION" }
        if (-not (Test-Path (Join-Path $env:LLVM_PATH 'bin\clang.cmd'))) { throw 'clang fixture is missing' }
        if ($env:CC -notmatch 'clang\.cmd$') { throw "Unexpected CC: $env:CC" }
        clang --version

  test-macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Install dependencies
      run: command -v jq >/dev/null || brew install jq

    - name: Check macOS entry point syntax
      run: bash -n llvmup llvm-prebuilt llvm-functions.sh install.sh

    - name: Resolve macOS archive from a version range
      env:
        LLVMUP_RELEASES_FILE: ${{ github.workspace }}/githubreleases.json
      run: |
        bash -c 'source ./llvm-functions.sh; llvm-resolve-remote-release "~20.1" macOS arm64' |
          jq -e '.version == "llvmorg-20.1.8" and .asset_name == "LLVM-20.1.8-macOS-ARM64.tar.xz"'

    - name: Prepare lightweight LLVM fixture for macOS action smoke test
      run: |
        fixture="$RUNNER_TEMP/llvmup-data/toolchains/llvmorg-20.1.8/bin"
        mkdir -p "$fixture"
        printf '#!/bin/sh\necho clang version 20.1.8\n' > "$fixture/clang"
        printf '#!/bin/sh\necho clang version 20.1.8\n' > "$fixture/clang++"
        printf '#!/bin/sh\nexit 0\n' > "$fixture/lld"
        chmod +x "$fixture/clang" "$fixture/clang++" "$fixture/lld"

    - name: Smoke test reusable action on macOS
      id: setup-llvm-macos
      uses: ./
      env:
        LLVMUP_RELEASES_FILE: ${{ github.workspace }}/githubreleases.json
      with:
        version: 20.1.8
        cache: false
        verbose: true

    - name: Verify macOS action outputs and environment
      env:
        RESOLVED_VERSION: ${{ steps.setup-llvm-macos.outputs.version }}
        LLVM_PATH: ${{ steps.setup-llvm-macos.outputs.llvm-path }}
      run: |
        test "$RESOLVED_VERSION" = "llvmorg-20.1.8"
        test -x "$LLVM_PATH/bin/clang"
        test "$CC" = "$LLVM_PATH/bin/clang"
        clang --version
