name: Action E2E

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact LLVM release to install on Linux and Windows
        required: true
        default: 22.1.8
        type: string
      macos_version:
        description: Exact LLVM release with a macOS ARM64 archive
        required: true
        default: 23.1.2
        type: string
      verify:
        description: Release verification policy
        required: true
        default: warn
        type: choice
        options:
          - warn
          - strict
          - skip

permissions:
  contents: read

concurrency:
  group: action-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Report macOS decompressor
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v tar
          tar --version | head -1
          if command -v xz; then
            xz --version | head -1
          else
            echo 'External xz is unavailable; the full profile uses tar for .tar.xz.'
          fi

      - name: Install LLVM through the local Action
        id: setup
        uses: ./
        with:
          version: ${{ matrix.os == 'macos-15' && inputs.macos_version || inputs.version }}
          verify: ${{ inputs.verify }}
          cache: true
          profile: ${{ matrix.os == 'macos-15' && 'full' || 'compiler' }}
          verbose: true
          strip: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Verify Unix installation
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        env:
          RESOLVED_VERSION: ${{ steps.setup.outputs.version }}
          LLVM_PATH: ${{ steps.setup.outputs.llvm-path }}
        run: |
          set -euo pipefail
          test -n "$RESOLVED_VERSION"
          test -x "$LLVM_PATH/bin/clang"
          test "$CC" = "$LLVM_PATH/bin/clang"
          clang --version
          llvm-cov --version
          llvm-profdata --version

      - name: Verify Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RESOLVED_VERSION: ${{ steps.setup.outputs.version }}
          LLVM_PATH: ${{ steps.setup.outputs.llvm-path }}
        run: |
          if (-not $env:RESOLVED_VERSION) { throw 'The version output is empty.' }
          if (-not (Test-Path (Join-Path $env:LLVM_PATH 'bin\clang.exe'))) { throw 'clang.exe is missing.' }
          if ($env:CC -ne (Join-Path $env:LLVM_PATH 'bin\clang.exe')) { throw "Unexpected CC: $env:CC" }
          clang --version
          llvm-cov --version
          llvm-profdata --version

      - name: Diagnose macOS SDK and linker
        if: runner.os == 'macOS'
        shell: bash
        env:
          LLVM_PATH: ${{ steps.setup.outputs.llvm-path }}
        run: |
          set -euxo pipefail
          xcode-select -p
          sdk_root="$(xcrun --sdk macosx --show-sdk-path)"
          test -d "$sdk_root"
          printf 'Configured SDKROOT: %s\n' "${SDKROOT:-<unset>}"
          printf 'Configured LD: %s\n' "${LD:-<unset>}"
          xcrun --find ld
          "$LLVM_PATH/bin/clang" --print-search-dirs

          diagnostic_dir="$(mktemp -d "$RUNNER_TEMP/llvmup-link.XXXXXX")"
          trap 'rm -rf "$diagnostic_dir"' EXIT
          printf 'int main(void) { return 0; }\n' > "$diagnostic_dir/test.c"

          (unset SDKROOT; "$LLVM_PATH/bin/clang" -### "$diagnostic_dir/test.c" -o "$diagnostic_dir/no-sdk") || true
          if (unset SDKROOT; "$LLVM_PATH/bin/clang" "$diagnostic_dir/test.c" -o "$diagnostic_dir/no-sdk"); then
            echo 'Link without SDKROOT succeeded.'
          else
            echo 'Link without SDKROOT failed.'
          fi

          "$LLVM_PATH/bin/clang" -### -isysroot "$sdk_root" "$diagnostic_dir/test.c" -o "$diagnostic_dir/explicit-sdk" || true
          "$LLVM_PATH/bin/clang" -isysroot "$sdk_root" "$diagnostic_dir/test.c" -o "$diagnostic_dir/explicit-sdk"
          "$diagnostic_dir/explicit-sdk"

          "$LLVM_PATH/bin/clang" -### "$diagnostic_dir/test.c" -o "$diagnostic_dir/exported-sdk" || true
          "$LLVM_PATH/bin/clang" "$diagnostic_dir/test.c" -o "$diagnostic_dir/exported-sdk"
          "$diagnostic_dir/exported-sdk"

      - name: Compile C/C++ and generate coverage
        shell: pwsh
        env:
          LLVM_PATH: ${{ steps.setup.outputs.llvm-path }}
        run: |
          if ($IsWindows) {
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          }
          python tests/integration/toolchain_smoke.py "$env:LLVM_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler/coverage smoke test failed' }

  restore:
    name: Restore cache (${{ matrix.os }})
    needs: install
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore LLVM through the local Action
        id: setup
        uses: ./
        with:
          version: ${{ matrix.os == 'macos-15' && inputs.macos_version || inputs.version }}
          verify: ${{ inputs.verify }}
          cache: true
          profile: ${{ matrix.os == 'macos-15' && 'full' || 'compiler' }}
          verbose: true
          strip: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Require an exact cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.setup.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true

      - name: Verify restored compiler
        run: clang --version

      - name: Compile C/C++ and generate coverage
        shell: pwsh
        env:
          LLVM_PATH: ${{ steps.setup.outputs.llvm-path }}
        run: |
          if ($IsWindows) {
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            & (Join-Path $vs 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          }
          python tests/integration/toolchain_smoke.py "$env:LLVM_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler/coverage smoke test failed' }
