name: Setup LLVM with llvmup
description: Install and configure a stable LLVM toolchain with authenticated release verification and optional caching
author: Fabio3rs

branding:
  icon: terminal
  color: blue

inputs:
  version:
    description: LLVM version expression, such as latest, 22.1.8, llvmorg-22.1.8, or ~22.1
    required: false
    default: latest
  profile:
    description: Installation profile (minimal, compiler, full, custom); defaults to full, or custom when components are supplied
    required: false
    default: ""
  components:
    description: Additional components, separated by commas or whitespace
    required: false
    default: ""
  strip:
    description: Strip Linux ELF executables after installation
    required: false
    default: "false"
  verbose:
    description: Log installation progress and disk usage at each stage
    required: false
    default: "false"
  cache:
    description: Restore and save the resolved LLVM toolchain with actions/cache
    required: false
    default: "true"
  verify:
    description: Release verification policy (warn, strict, or skip)
    required: false
    default: warn
  github-token:
    description: Optional token used for GitHub API and attestation verification
    required: false
    default: ""
  provider:
    description: Toolchain provider (official, winlibs, llvm-mingw). The version input selects the LLVM version.
    required: false
    default: official
  release:
    description: Exact upstream release tag of the provider (for example 20261117 for llvm-mingw)
    required: false
    default: ""
  crt:
    description: C runtime variant for MinGW providers (ucrt or msvcrt)
    required: false
    default: ""
  target:
    description: Target triple to activate inside a multi-target bundle (for example aarch64-w64-mingw32)
    required: false
    default: ""
  compiler:
    description: Compiler to activate inside a bundle that ships several (clang or gcc for WinLibs)
    required: false
    default: ""
  extractor:
    description: Archive extractor (auto, 7z, tar, zip, python)
    required: false
    default: auto

outputs:
  version:
    description: Exact upstream release tag selected by llvmup
    value: ${{ steps.provider-resolve-unix.outputs.release || steps.provider-resolve-windows.outputs.release }}
  llvm-path:
    description: Absolute path to the installed toolchain
    value: ${{ steps.provider-activate-unix.outputs.toolchain-path || steps.provider-activate-windows.outputs.toolchain-path }}
  cache-hit:
    description: Whether an exact toolchain cache entry was restored
    value: ${{ steps.provider-cache.outputs.cache-hit || 'false' }}
  verification:
    description: Verification methods recorded for the installed toolchain
    value: ${{ steps.provider-activate-unix.outputs.verification || steps.provider-activate-windows.outputs.verification }}
  provider:
    description: Provider of the installed toolchain
    value: ${{ steps.provider-resolve-unix.outputs.provider || steps.provider-resolve-windows.outputs.provider }}
  release:
    description: Exact upstream release tag selected by llvmup
    value: ${{ steps.provider-resolve-unix.outputs.release || steps.provider-resolve-windows.outputs.release }}
  llvm-version:
    description: LLVM compiler version in the selected release
    value: ${{ steps.provider-resolve-unix.outputs.llvm-version || steps.provider-resolve-windows.outputs.llvm-version }}
  toolchain-id:
    description: Canonical LLVMUP toolchain identity
    value: ${{ steps.provider-resolve-unix.outputs.toolchain-id || steps.provider-resolve-windows.outputs.toolchain-id }}
  toolchain-path:
    description: Absolute path to the installed toolchain
    value: ${{ steps.provider-activate-unix.outputs.toolchain-path || steps.provider-activate-windows.outputs.toolchain-path }}

runs:
  using: composite
  steps:
    - name: Reject unsupported runner
      if: runner.os != 'Linux' && runner.os != 'macOS' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "llvmup's composite action supports Linux, macOS ARM64, and Windows runners." >&2
        exit 1

    - name: Validate inputs
      id: request
      shell: bash
      env:
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_PROVIDER: ${{ inputs.provider }}
        INPUT_EXTRACTOR: ${{ inputs.extractor }}
        INPUT_VERIFY: ${{ inputs.verify }}
      run: |
        set -euo pipefail
        case "$INPUT_CACHE" in true|false) ;; *) echo "cache must be 'true' or 'false'." >&2; exit 1 ;; esac
        case "$INPUT_VERIFY" in warn|strict|skip) ;; *) echo "verify must be 'warn', 'strict', or 'skip'." >&2; exit 1 ;; esac
        provider="$(printf '%s' "$INPUT_PROVIDER" | tr '[:upper:]' '[:lower:]')"
        case "$provider" in official|winlibs|llvm-mingw) ;; *) echo "Unknown provider." >&2; exit 1 ;; esac
        case "$INPUT_EXTRACTOR" in auto|7z|tar|zip|python) ;; *) echo "Unknown extractor." >&2; exit 1 ;; esac
        printf 'provider=%s\n' "$provider" >> "$GITHUB_OUTPUT"

    - name: Install llvmup CLI
      if: runner.os == 'Linux' || runner.os == 'macOS'
      shell: bash
      env:
        LLVMUP_CLI_PREFIX: ${{ runner.temp }}/llvmup-cli
        LLVMUP_DATA_HOME: ${{ runner.temp }}/llvmup-data
      run: |
        set -euo pipefail
        (
          cd "$GITHUB_ACTION_PATH"
          LLVMUP_PREFIX="$LLVMUP_CLI_PREFIX" ./install.sh --ci
        )
        printf '%s\n' "$LLVMUP_CLI_PREFIX/bin" >> "$GITHUB_PATH"
        {
          printf 'LLVMUP_PREFIX=%s\n' "$LLVMUP_CLI_PREFIX"
          printf 'LLVMUP_INSTALL_DIR=%s\n' "$LLVMUP_CLI_PREFIX/bin"
          printf 'LLVM_HOME=%s\n' "$LLVMUP_DATA_HOME"
          printf 'LLVM_TOOLCHAINS_DIR=%s\n' "$LLVMUP_DATA_HOME/toolchains"
          printf 'LLVM_SOURCES_DIR=%s\n' "$LLVMUP_DATA_HOME/sources"
          printf 'LLVMUP_DISABLE_AUTOACTIVATE=1\n'
        } >> "$GITHUB_ENV"

    - name: Configure Windows data paths
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $dataHome = Join-Path $env:RUNNER_TEMP 'llvmup-data'
        "LLVM_HOME=$dataHome" | Add-Content -Path $env:GITHUB_ENV
        "LLVM_TOOLCHAINS_DIR=$(Join-Path $dataHome 'toolchains')" | Add-Content -Path $env:GITHUB_ENV
        "LLVMUP_DISABLE_AUTOACTIVATE=1" | Add-Content -Path $env:GITHUB_ENV

    - name: Resolve Unix component selection
      if: (runner.os == 'Linux' || runner.os == 'macOS')
      id: selection-linux
      shell: bash
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_STRIP: ${{ inputs.strip }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        set -euo pipefail
        case "$INPUT_STRIP:$INPUT_VERBOSE" in true:true|true:false|false:true|false:false) ;; *) echo 'strip and verbose must be true or false' >&2; exit 1 ;; esac
        SCRIPT_DIR="$GITHUB_ACTION_PATH"
        source "$SCRIPT_DIR/libexec/llvmup-selection.sh"
        PROFILE="$INPUT_PROFILE"
        COMPONENTS=()
        while IFS= read -r component; do [ -z "$component" ] || COMPONENTS+=("$component"); done < <(printf '%s' "$INPUT_COMPONENTS" | tr ',[:space:]' '\n')
        STRIP=0; [ "$INPUT_STRIP" != true ] || STRIP=1
        llvm_selection_init
        printf 'key=%s\n' "$(jq -r '.key' <<< "$LLVM_SELECTION_JSON")" >> "$GITHUB_OUTPUT"

    - name: Resolve Windows component selection
      if: (runner.os == 'Windows')
      id: selection-windows
      shell: pwsh
      env:
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_STRIP: ${{ inputs.strip }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
      run: |
        if ($env:INPUT_STRIP -notin @('true', 'false') -or $env:INPUT_VERBOSE -notin @('true', 'false')) { throw 'strip and verbose must be true or false' }
        if ($env:INPUT_STRIP -eq 'true') { throw 'Strip is supported only on Linux' }
        Import-Module (Join-Path $env:GITHUB_ACTION_PATH 'libexec/Llvm-Selection.psm1') -Force
        $components = @($env:INPUT_COMPONENTS -split '[,\s]+' | Where-Object { $_ })
        $selection = Get-LlvmSelection -Profile $env:INPUT_PROFILE -Components $components
        "key=$($selection.key)" | Add-Content -Path $env:GITHUB_OUTPUT

    - name: Report Unix disk usage before cache restore
      if: (runner.os == 'Linux' || runner.os == 'macOS') && inputs.verbose == 'true'
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/libexec/llvmup-selection.sh"
        VERBOSE=1
        llvm_space_snapshot 'before cache restore' "$RUNNER_TEMP/llvmup-data"

    - name: Report Windows disk usage before cache restore
      if: runner.os == 'Windows' && inputs.verbose == 'true'
      shell: pwsh
      run: |
        Import-Module (Join-Path $env:GITHUB_ACTION_PATH 'libexec/Llvm-Selection.psm1') -Force
        Write-LlvmSpaceSnapshot -Label 'before cache restore' -Paths @((Join-Path $env:RUNNER_TEMP 'llvmup-data')) -Enabled $true

    - name: Resolve provider release on Unix
      if: (runner.os == 'Linux' || runner.os == 'macOS')
      id: provider-resolve-unix
      shell: bash
      env:
        LLVMUP_IGNORE_CONFIG: '1'
        LLVMUP_DISABLE_AUTOACTIVATE: '1'
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_CRT: ${{ inputs.crt }}
        INPUT_EXTRACTOR: ${{ inputs.extractor }}
        INPUT_TARGET: ${{ inputs.target }}
        PROVIDER: ${{ steps.request.outputs.provider }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        set -euo pipefail
        args=("$PROVIDER@${INPUT_VERSION:-latest}" --format json --extractor "$INPUT_EXTRACTOR")
        [ -z "$INPUT_RELEASE" ] || args+=(--release "$INPUT_RELEASE")
        [ -z "$INPUT_CRT" ] || args+=(--crt "$INPUT_CRT")
        [ -z "$INPUT_TARGET" ] || args+=(--target "$INPUT_TARGET")
        metadata="$(llvmup resolve "${args[@]}")"
        {
          printf 'provider=%s\n' "$PROVIDER"
          printf 'expected-asset=%s\n' "$(jq -c '{canonical_id, release, asset_name, asset_id, asset_digest}' <<< "$metadata")"
          printf 'release=%s\n' "$(jq -r '.release' <<< "$metadata")"
          printf 'llvm-version=%s\n' "$(jq -r '.llvm_version' <<< "$metadata")"
          printf 'toolchain-id=%s\n' "$(jq -r '.canonical_id' <<< "$metadata")"
          printf 'asset-key=%s\n' "$(jq -r '"asset-" + (.asset_id | tostring) + "-" + (.asset_digest // "")' <<< "$metadata")"
        } >> "$GITHUB_OUTPUT"

    - name: Resolve provider release on Windows
      if: runner.os == 'Windows'
      id: provider-resolve-windows
      shell: pwsh
      env:
        LLVMUP_IGNORE_CONFIG: '1'
        LLVMUP_DISABLE_AUTOACTIVATE: '1'
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_RELEASE: ${{ inputs.release }}
        INPUT_CRT: ${{ inputs.crt }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_EXTRACTOR: ${{ inputs.extractor }}
        PROVIDER: ${{ steps.request.outputs.provider }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        $version = if ($env:INPUT_VERSION) { $env:INPUT_VERSION } else { 'latest' }
        $cliArgs = @("$($env:PROVIDER)@$version", '--format', 'json')
        if ($env:INPUT_RELEASE) { $cliArgs += @('--release', $env:INPUT_RELEASE) }
        if ($env:INPUT_TARGET) { $cliArgs += @('--target', $env:INPUT_TARGET) }
        if ($env:INPUT_EXTRACTOR) { $cliArgs += @('--extractor', $env:INPUT_EXTRACTOR) }
        if ($env:INPUT_CRT) { $cliArgs += @('--crt', $env:INPUT_CRT) }
        $text = & (Join-Path $env:GITHUB_ACTION_PATH 'llvmup.cmd') resolve @cliArgs
        if ($LASTEXITCODE -ne 0) { throw "llvmup resolve failed with exit code $LASTEXITCODE" }
        $m = ($text -join "`n") | ConvertFrom-Json
        $assetKey = "asset-$($m.asset_id)-$($m.asset_digest)"
        $expectedAsset = $m | Select-Object canonical_id, release, asset_name, asset_id, asset_digest | ConvertTo-Json -Compress
        @("provider=$($env:PROVIDER)", "expected-asset=$expectedAsset", "release=$($m.release)", "llvm-version=$($m.llvm_version)", "toolchain-id=$($m.canonical_id)", "asset-key=$assetKey") |
          Add-Content -Path $env:GITHUB_OUTPUT

    - name: Restore provider toolchain cache
      if: inputs.cache == 'true'
      id: provider-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ runner.temp }}/llvmup-data/toolchains/${{ steps.provider-resolve-unix.outputs.toolchain-id || steps.provider-resolve-windows.outputs.toolchain-id }}
        # Cache exact provider assets and component selections. Activation choices share the bundle.
        key: llvmup-provider-v3-${{ steps.selection-linux.outputs.key || steps.selection-windows.outputs.key }}-${{ steps.request.outputs.provider }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.verify }}-${{ steps.provider-resolve-unix.outputs.toolchain-id || steps.provider-resolve-windows.outputs.toolchain-id }}-${{ steps.provider-resolve-unix.outputs.asset-key || steps.provider-resolve-windows.outputs.asset-key }}

    - name: Install or validate provider toolchain on Unix
      if: (runner.os == 'Linux' || runner.os == 'macOS')
      shell: bash
      env:
        LLVMUP_IGNORE_CONFIG: '1'
        PROVIDER: ${{ steps.request.outputs.provider }}
        RELEASE: ${{ steps.provider-resolve-unix.outputs.release }}
        TOOLCHAIN_ID: ${{ steps.provider-resolve-unix.outputs.toolchain-id }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_STRIP: ${{ inputs.strip }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_TARGET: ${{ inputs.target }}
        LLVMUP_EXPECTED_ASSET_JSON: ${{ steps.provider-resolve-unix.outputs.expected-asset }}
        INPUT_CRT: ${{ inputs.crt }}
        INPUT_EXTRACTOR: ${{ inputs.extractor }}
        VERIFY_POLICY: ${{ inputs.verify }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        set -euo pipefail
        args=("$PROVIDER@latest" --release "$RELEASE" --name "$TOOLCHAIN_ID" --verify "$VERIFY_POLICY" --extractor "${INPUT_EXTRACTOR:-auto}")
        [ -z "$INPUT_CRT" ] || args+=(--crt "$INPUT_CRT")
        [ -z "$INPUT_PROFILE" ] || args+=(--profile "$INPUT_PROFILE")
        [ -z "$INPUT_TARGET" ] || args+=(--target "$INPUT_TARGET")
        [ "$INPUT_STRIP" != true ] || args+=(--strip)
        [ "$INPUT_VERBOSE" = true ] || args+=(--quiet)
        while IFS= read -r component; do [ -z "$component" ] || args+=(--component "$component"); done < <(printf '%s' "$INPUT_COMPONENTS" | tr ',[:space:]' '\n')
        llvmup install "${args[@]}"

    - name: Install or validate provider toolchain on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        LLVMUP_IGNORE_CONFIG: '1'
        PROVIDER: ${{ steps.request.outputs.provider }}
        RELEASE: ${{ steps.provider-resolve-windows.outputs.release }}
        TOOLCHAIN_ID: ${{ steps.provider-resolve-windows.outputs.toolchain-id }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_COMPONENTS: ${{ inputs.components }}
        INPUT_STRIP: ${{ inputs.strip }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_TARGET: ${{ inputs.target }}
        LLVMUP_EXPECTED_ASSET_JSON: ${{ steps.provider-resolve-windows.outputs.expected-asset }}
        INPUT_CRT: ${{ inputs.crt }}
        INPUT_EXTRACTOR: ${{ inputs.extractor }}
        VERIFY_POLICY: ${{ inputs.verify }}
        GITHUB_TOKEN: ${{ inputs.github-token || github.token }}
        GH_TOKEN: ${{ inputs.github-token || github.token }}
      run: |
        $cliArgs = @("$($env:PROVIDER)@latest", '--release', $env:RELEASE, '--name', $env:TOOLCHAIN_ID, '--verify', $env:VERIFY_POLICY, '--extractor', $env:INPUT_EXTRACTOR)
        if ($env:INPUT_CRT) { $cliArgs += @('--crt', $env:INPUT_CRT) }
        if ($env:INPUT_PROFILE) { $cliArgs += @('--profile', $env:INPUT_PROFILE) }
        if ($env:INPUT_TARGET) { $cliArgs += @('--target', $env:INPUT_TARGET) }
        if ($env:INPUT_VERBOSE -ne 'true') { $cliArgs += '--quiet' }
        foreach ($component in ($env:INPUT_COMPONENTS -split '[,\s]+' | Where-Object { $_ })) {
            $cliArgs += @('--component', $component)
        }
        & (Join-Path $env:GITHUB_ACTION_PATH 'llvmup.cmd') install @cliArgs
        if ($LASTEXITCODE -ne 0) { throw "llvmup install failed with exit code $LASTEXITCODE" }

    - name: Activate provider toolchain on Unix
      if: (runner.os == 'Linux' || runner.os == 'macOS')
      id: provider-activate-unix
      shell: bash
      env:
        TOOLCHAIN_ID: ${{ steps.provider-resolve-unix.outputs.toolchain-id }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_COMPILER: ${{ inputs.compiler }}
      run: |
        set -euo pipefail
        args=("$TOOLCHAIN_ID" --format github)
        [ -z "$INPUT_TARGET" ] || args+=(--target "$INPUT_TARGET")
        [ -z "$INPUT_COMPILER" ] || args+=(--compiler "$INPUT_COMPILER")
        llvmup env "${args[@]}"
        root="$(llvmup where "$TOOLCHAIN_ID")"
        verification="$(jq -r '(.verification.methods // ["unverified"]) | if type == "array" then join("+") else . end' "$root/.llvmup-toolchain.json" 2>/dev/null || printf unverified)"
        printf 'toolchain-path=%s\nverification=%s\n' "$root" "$verification" >> "$GITHUB_OUTPUT"

    - name: Activate provider toolchain on Windows
      if: runner.os == 'Windows'
      id: provider-activate-windows
      shell: pwsh
      env:
        TOOLCHAIN_ID: ${{ steps.provider-resolve-windows.outputs.toolchain-id }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_COMPILER: ${{ inputs.compiler }}
      run: |
        $launcher = Join-Path $env:GITHUB_ACTION_PATH 'llvmup.cmd'
        $cliArgs = @($env:TOOLCHAIN_ID, '--format', 'github')
        if ($env:INPUT_TARGET) { $cliArgs += @('--target', $env:INPUT_TARGET) }
        if ($env:INPUT_COMPILER) { $cliArgs += @('--compiler', $env:INPUT_COMPILER) }
        & $launcher env @cliArgs
        if ($LASTEXITCODE -ne 0) { throw "llvmup env failed with exit code $LASTEXITCODE" }
        $root = (& $launcher where $env:TOOLCHAIN_ID | Select-Object -Last 1)
        $manifest = Join-Path $root '.llvmup-toolchain.json'
        $verification = if (Test-Path $manifest) { @((Get-Content $manifest -Raw | ConvertFrom-Json).verification.methods) -join '+' } else { 'unverified' }
        @("toolchain-path=$root", "verification=$verification") | Add-Content -Path $env:GITHUB_OUTPUT

    - name: Report final Linux disk usage
      if: always() && runner.os == 'Linux' && inputs.verbose == 'true'
      shell: bash
      run: |
        source "$GITHUB_ACTION_PATH/libexec/llvmup-selection.sh"
        VERBOSE=1
        llvm_space_snapshot 'Action completion' "$RUNNER_TEMP/llvmup-data"

    - name: Report final Windows disk usage
      if: always() && runner.os == 'Windows' && inputs.verbose == 'true'
      shell: pwsh
      run: |
        Import-Module (Join-Path $env:GITHUB_ACTION_PATH 'libexec/Llvm-Selection.psm1') -Force
        Write-LlvmSpaceSnapshot -Label 'Action completion' -Paths @((Join-Path $env:RUNNER_TEMP 'llvmup-data')) -Enabled $true
